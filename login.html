<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · Podcast Studio</title>
<script>
// Sprint 3: Branding kommt serverseitig im <head> (siehe BRANDING-Block oben).
// Beim ersten Paint stimmen --brand/--brand-hover/--brand-on bereits -> kein
// Aufblitzen der Default-Farbe, kein Verstecken der Seite.
(() => {
  const b = window.__BRANDING__;
  if (!b || !b.ok) return;
  try {
    if (b.name) document.title = document.title.replace(/Podcast Studio/, b.name);
  } catch {}
})();
</script>
<style>
  :root {
    --bg:     #0f1115;
    --panel:  #181b22;
    --panel2: #11141a;
    --border: #2a2f3a;
    --text:   #e8eaed;
    --muted:  #9aa3b2;

    /* Semantic success (must never be overridden by branding) */
    --ok:     #30a46c;
    --ok-h:   #3cbf7e;

    /* Brand accent */
    --brand: var(--ok);
    --brand-hover: var(--ok-h);
    --brand-on: #fff;

    --err:    #e5484d;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 42px;
    width: 100%; max-width: 400px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .logo { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -.5px; }
  .sub  { color: var(--muted); font-size: 15px; margin: -12px 0 0; }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  .input-wrap { position: relative; }
  #pw {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 44px 12px 14px; font: inherit; font-size: 16px;
    outline: none; transition: border-color .15s;
  }
  #pw:focus { border-color: var(--brand); }
  .toggle-pw {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 4px;
    color: var(--muted); font-size: 18px; line-height: 1;
    transition: color .15s;
  }
  .toggle-pw:hover { color: var(--text); }
  button[type="submit"] {
    background: var(--brand); color: var(--brand-on);
    border: 1px solid var(--brand); border-radius: 8px;
    padding: 13px 16px; font: inherit; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background .15s, border-color .15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  button[type="submit"]:hover:not(:disabled) {
    background: var(--brand-hover); border-color: var(--brand-hover);
  }
  button[type="submit"]:disabled { opacity: .5; cursor: not-allowed; }
  .msg {
    font-size: 14px; border-radius: 8px; padding: 10px 12px;
    display: none; line-height: 1.4;
  }
  .msg.err  { display: block; background: rgba(229,72,77,.12); border: 1px solid var(--err); color: var(--err); }
  .msg.info { display: block; background: rgba(48,164,108,.12); border: 1px solid var(--ok);  color: var(--ok); }
  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<!-- Branding zuletzt: ueberschreibt die :root-Defaults oben. -->
<!--BRANDING-->
</head>
<body>
<div class="card">
  <h1 class="logo">DVZ Podcast Studio</h1>
  <p class="sub">Bitte melde dich an, um fortzufahren.</p>

  <div id="msg" class="msg" role="alert"></div>

  <form id="loginForm" autocomplete="on" novalidate>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div>
        <label for="pw"></label>
        <div class="input-wrap">
          <input type="password" id="pw" name="password"
                 autocomplete="current-password"
                 placeholder="Passwort" required autofocus>
          <button type="button" class="toggle-pw" id="togglePw"
                  aria-label="Passwort anzeigen/verbergen">👁</button>
        </div>
      </div>
      <button type="submit" id="submitBtn">
        <span id="btnLabel">Anmelden</span>
      </button>
    </div>
  </form>
</div>

<script>
(() => {
  // Branding is already applied early in <head> (no second fetch here).
  // Keep only non-color branding below (name, favicon).
  (async () => {
    try {
      const b = await (await fetch('/branding', { cache: 'no-store' })).json();
      if (!b.ok) return;
      if (b.name) document.title = 'Login · ' + b.name;
      if (b.favicon) {
        let link = document.querySelector('link[rel="icon"]');
        if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
        link.href = b.favicon;
      }
    } catch {}
  })();

  const form      = document.getElementById('loginForm');
  const pwInput   = document.getElementById('pw');
  const submitBtn = document.getElementById('submitBtn');
  const btnLabel  = document.getElementById('btnLabel');
  const msg       = document.getElementById('msg');
  const togglePw  = document.getElementById('togglePw');

  // Passwort anzeigen / verbergen
  togglePw.addEventListener('click', () => {
    const isText = pwInput.type === 'text';
    pwInput.type = isText ? 'password' : 'text';
    togglePw.textContent = isText ? '👁' : 'X';
    pwInput.focus();
  });

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className   = 'msg ' + type;
  }

  function setLoading(on) {
    submitBtn.disabled = on;
    btnLabel.innerHTML = on
      ? '<span class="spinner"></span> Anmelden…'
      : 'Anmelden';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = pwInput.value;
    if (!password) { showMsg('Bitte ein Passwort eingeben.', 'err'); return; }

    setLoading(true);
    msg.className = 'msg'; // ausblenden

    try {
      const fd = new FormData();
      fd.append('password', password);

      const res  = await fetch('/login', { method: 'POST', body: fd });
      const data = await res.json();

      if (data.ok) {
        showMsg('Anmeldung erfolgreich. Weiterleitung…', 'info');
        // Redirect-Ziel aus URL-Parameter ?next= lesen, sonst /
        const params = new URLSearchParams(location.search);
        const next   = params.get('next') || data.redirect || '/';
        setTimeout(() => { location.href = next; }, 500);
      } else {
        showMsg(data.error || 'Anmeldung fehlgeschlagen.', 'err');
        pwInput.value = '';
        pwInput.focus();
        setLoading(false);
      }
    } catch (err) {
      showMsg('Verbindungsfehler: ' + err.message, 'err');
      setLoading(false);
    }
  });
})();
</script>
</body>
</html>
